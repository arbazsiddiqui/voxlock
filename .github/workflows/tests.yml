name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[livekit]" pytest
      - name: Fetch the model
        run: voxlock download
      - name: Test
        run: pytest -q tests/test_live.py tests/test_sample_length.py tests/test_livekit.py
