[project]
name = "livekit-plugins-voxlock"
version = "1.3.0"
description = "VoxLock for LiveKit Agents: keeps the caller's voice and removes the other voices in the room, on the agent's CPU"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["voxlock[livekit]>=1.3.0,<2"]
authors = [{ name = "Arbaz Siddiqui", email = "arbaz00@gmail.com" }]
keywords = ["livekit", "livekit-agents", "voice agents", "noise cancellation", "background voice cancellation", "voice isolation", "target speaker extraction"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/arbazsiddiqui/voxlock"
Repository = "https://github.com/arbazsiddiqui/voxlock"
Model = "https://huggingface.co/arbazsiddiqui/voxlock"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit", "README.md", "LICENSE"]
